[project]
name = "remynder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.11.0",
    "pyqt6-sip>=13.13.0",
    "toml>=0.10.2",
]

[project.scripts]
remynder = "remynder.__main__:main"

[dependency-groups]
dev = ["mypy>=2.4.1", "pyinstaller>=6.22.3", "ruff>=0.17.5"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "PTH", "PLW", "RUF"]

[tool.mypy]
strict = true
